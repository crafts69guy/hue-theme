id = "hue-theme"
name = "Hue Theme"
version = "0.3.0"
min_herdr_version = "0.7.1"
description = "Apply the Hue Tide theme (mua/huong/cung) to herdr's [theme.custom] and to hunk's review config, synced with hue-theme.fish."

[[actions]]
id = "apply-mood"
title = "Apply Hue Theme"
description = "Splice the current Hue mood into herdr's config.toml and write hunk's review theme, then reload."
contexts = ["global"]
command = ["bash", "apply.sh"]

[[events]]
on = "workspace.created"
command = ["bash", "apply.sh"]
