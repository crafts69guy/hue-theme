id = "hue-theme"
name = "Hue Theme"
version = "0.2.0"
min_herdr_version = "0.7.1"
description = "Apply the Hue Tide theme (mua/huong/cung) to herdr's [theme.custom], synced with hue-theme.fish."

[[actions]]
id = "apply-mood"
title = "Apply Hue Theme"
description = "Splice the current Hue mood's colors into config.toml and reload."
contexts = ["global"]
command = ["bash", "apply.sh"]

[[events]]
on = "workspace.created"
command = ["bash", "apply.sh"]
