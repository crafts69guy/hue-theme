# hue-theme managed hunk theme — regenerated when the Hue mood changes.
# Generated by scripts/build.ts. Do not edit.
# Huế Hương — Hue theme for hunk (modem-dev/hunk). Written to
# ~/.config/hunk/config.toml by the herdr-plugin's apply.sh on mood change.
theme = "custom"
transparent_background = true

[custom_theme]
base = "github-dark-default"
label = "hue-huong"
background = "#0F1D19"
panel = "#182A24"
panelAlt = "#244E42"
border = "#587168"
accent = "#6FD0A8"
accentMuted = "#8A968E"
text = "#D6DAD0"
muted = "#98A59C"
badgeAdded = "#6FD0A8"
badgeRemoved = "#D38478"
badgeNeutral = "#98A59C"
fileNew = "#6FD0A8"
fileDeleted = "#D38478"
fileRenamed = "#DCBB80"
fileModified = "#7FBAC8"
fileUntracked = "#98A59C"
addedSignColor = "#6FD0A8"
removedSignColor = "#D38478"
lineNumberFg = "#98A59C"
lineNumberBg = "#0F1D19"
selectedHunk = "#244E42"
contextBg = "#0F1D19"
contextContentBg = "#0F1D19"
addedBg = "#26483B"
addedContentBg = "#1D382E"
removedBg = "#3E3630"
removedContentBg = "#2C2C27"
movedAddedBg = "#2A4343"
movedRemovedBg = "#343C43"
noteBorder = "#587168"
noteBackground = "#182A24"
noteTitleBackground = "#244E42"
noteTitleText = "#D6DAD0"

[custom_theme.syntax_scopes]
"comment" = "#6C7E76"
"punctuation.definition.comment" = "#6C7E76"
"string" = "#6FD0A8"
"string.quoted" = "#6FD0A8"
"constant.numeric" = "#DCBB80"
"constant.language" = "#DCBB80"
"constant.character" = "#DCBB80"
"constant.other" = "#DCBB80"
"constant.character.escape" = "#D38478"
"string.regexp" = "#D38478"
"keyword" = "#A9A0C8"
"storage" = "#A9A0C8"
"storage.type" = "#A9A0C8"
"keyword.control" = "#A9A0C8"
"keyword.operator" = "#D38478"
"entity.name.function" = "#7FBAC8"
"support.function" = "#7FBAC8"
"entity.name.type" = "#7FBAC8"
"entity.name.class" = "#7FBAC8"
"support.type" = "#7FBAC8"
"support.class" = "#7FBAC8"
"variable" = "#D6DAD0"
"variable.other" = "#D6DAD0"
"variable.other.member" = "#D6DAD0"
"support.type.property-name" = "#D6DAD0"
"meta.property-name" = "#D6DAD0"
"entity.name.tag" = "#A9A0C8"
"entity.other.attribute-name" = "#D6DAD0"
"punctuation" = "#8A968E"
