# hue-theme managed hunk theme — regenerated when the Hue mood changes.
# Generated by scripts/build.ts. Do not edit.
# Huế Cung — Hue theme for hunk (modem-dev/hunk). Written to
# ~/.config/hunk/config.toml by the herdr-plugin's apply.sh on mood change.
theme = "custom"
transparent_background = true

[custom_theme]
base = "github-light-default"
label = "hue-cung"
background = "#F3ECD9"
panel = "#E8DDC5"
panelAlt = "#CBDDD2"
border = "#8C846F"
accent = "#3A6E5F"
accentMuted = "#7C7565"
text = "#3C372C"
muted = "#66604F"
badgeAdded = "#3A6E5F"
badgeRemoved = "#A6403A"
badgeNeutral = "#66604F"
fileNew = "#3A6E5F"
fileDeleted = "#A6403A"
fileRenamed = "#8B5C1A"
fileModified = "#3D6480"
fileUntracked = "#66604F"
addedSignColor = "#3A6E5F"
removedSignColor = "#A6403A"
lineNumberFg = "#66604F"
lineNumberBg = "#F3ECD9"
selectedHunk = "#CBDDD2"
contextBg = "#F3ECD9"
contextContentBg = "#F3ECD9"
addedBg = "#C7CEBC"
addedContentBg = "#D7D9C7"
removedBg = "#E1C3B3"
removedContentBg = "#E7D2C1"
movedAddedBg = "#C7CBC4"
movedRemovedBg = "#D2C7C5"
noteBorder = "#8C846F"
noteBackground = "#E8DDC5"
noteTitleBackground = "#CBDDD2"
noteTitleText = "#3C372C"

[custom_theme.syntax_scopes]
"comment" = "#8A8473"
"punctuation.definition.comment" = "#8A8473"
"string" = "#3A6E5F"
"string.quoted" = "#3A6E5F"
"constant.numeric" = "#8B5C1A"
"constant.language" = "#8B5C1A"
"constant.character" = "#8B5C1A"
"constant.other" = "#8B5C1A"
"constant.character.escape" = "#A6403A"
"string.regexp" = "#A6403A"
"keyword" = "#6A5384"
"storage" = "#6A5384"
"storage.type" = "#6A5384"
"keyword.control" = "#6A5384"
"keyword.operator" = "#A6403A"
"entity.name.function" = "#3D6480"
"support.function" = "#3D6480"
"entity.name.type" = "#3D6480"
"entity.name.class" = "#3D6480"
"support.type" = "#3D6480"
"support.class" = "#3D6480"
"variable" = "#3C372C"
"variable.other" = "#3C372C"
"variable.other.member" = "#3C372C"
"support.type.property-name" = "#3C372C"
"meta.property-name" = "#3C372C"
"entity.name.tag" = "#6A5384"
"entity.other.attribute-name" = "#3C372C"
"punctuation" = "#7C7565"
