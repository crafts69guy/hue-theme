# hue-theme managed hunk theme — regenerated when the Hue mood changes.
# Generated by scripts/build.ts. Do not edit.
# Huế Mưa — Hue theme for hunk (modem-dev/hunk). Written to
# ~/.config/hunk/config.toml by the herdr-plugin's apply.sh on mood change.
theme = "custom"
transparent_background = true

[custom_theme]
base = "github-dark-default"
label = "hue-mua"
background = "#15191B"
panel = "#23282A"
panelAlt = "#2D4640"
border = "#5B6F69"
accent = "#7FB89C"
accentMuted = "#8B948F"
text = "#CFCCC2"
muted = "#9DA39E"
badgeAdded = "#7FB89C"
badgeRemoved = "#CC8079"
badgeNeutral = "#9DA39E"
fileNew = "#7FB89C"
fileDeleted = "#CC8079"
fileRenamed = "#D9BC8A"
fileModified = "#84AEC0"
fileUntracked = "#9DA39E"
addedSignColor = "#7FB89C"
removedSignColor = "#CC8079"
lineNumberFg = "#9DA39E"
lineNumberBg = "#15191B"
selectedHunk = "#2D4640"
contextBg = "#15191B"
contextContentBg = "#15191B"
addedBg = "#2E3F3A"
addedContentBg = "#25312E"
removedBg = "#413232"
removedContentBg = "#302829"
movedAddedBg = "#303D43"
movedRemovedBg = "#3A3A46"
noteBorder = "#5B6F69"
noteBackground = "#23282A"
noteTitleBackground = "#2D4640"
noteTitleText = "#CFCCC2"

[custom_theme.syntax_scopes]
"comment" = "#6E7F7A"
"punctuation.definition.comment" = "#6E7F7A"
"string" = "#7FB89C"
"string.quoted" = "#7FB89C"
"constant.numeric" = "#D9BC8A"
"constant.language" = "#D9BC8A"
"constant.character" = "#D9BC8A"
"constant.other" = "#D9BC8A"
"constant.character.escape" = "#CC8079"
"string.regexp" = "#CC8079"
"keyword" = "#AFA3CE"
"storage" = "#AFA3CE"
"storage.type" = "#AFA3CE"
"keyword.control" = "#AFA3CE"
"keyword.operator" = "#CC8079"
"entity.name.function" = "#84AEC0"
"support.function" = "#84AEC0"
"entity.name.type" = "#84AEC0"
"entity.name.class" = "#84AEC0"
"support.type" = "#84AEC0"
"support.class" = "#84AEC0"
"variable" = "#CFCCC2"
"variable.other" = "#CFCCC2"
"variable.other.member" = "#CFCCC2"
"support.type.property-name" = "#CFCCC2"
"meta.property-name" = "#CFCCC2"
"entity.name.tag" = "#AFA3CE"
"entity.other.attribute-name" = "#CFCCC2"
"punctuation" = "#8B948F"
