# Generated by scripts/build.ts. Do not edit.
# Huế Mưa — Hue theme for tmux. Source this from tmux.conf.

# Copy mode + messages
set -g mode-style "fg=#E5F4FF,bg=#123F6E"
set -g message-style "fg=#E5F4FF,bg=#0A2E52"
set -g message-command-style "fg=#E5F4FF,bg=#0A2E52"

# Panes
set -g pane-border-style "fg=#4E7AA6"
set -g pane-active-border-style "fg=#00CF6A"
set -g display-panes-active-colour "#00CF6A"
set -g display-panes-colour "#9DB4D4"
setw -g clock-mode-colour "#00CF6A"

# Status bar
set -g status "on"
set -g status-interval 1
set -g status-justify "left"
set -g status-style "fg=#9DB4D4,bg=#0A2E52"
set -g status-bg "#001F3E"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#001F3E,bg=#00CF6A,bold] #S:#I.#P #[fg=#00CF6A,bg=#123F6E,nobold,nounderscore,noitalics]#[fg=#E5F4FF,bg=#123F6E,bold] #(whoami) #[fg=#123F6E,bg=#001F3E,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#123F6E,bg=#001F3E,nobold,nounderscore,noitalics]#[fg=#9DB4D4,bg=#123F6E] #[fg=#8A7BFF,bg=#123F6E,nobold,nounderscore,noitalics]#[fg=#001F3E,bg=#8A7BFF,bold] #h "

# Window list
setw -g window-status-activity-style "underscore,fg=#9DB4D4,bg=#001F3E"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#9DB4D4,bg=#001F3E"
setw -g window-status-format "#[fg=#001F3E,bg=#001F3E]#[default] #I  #{b:pane_current_path} #[fg=#001F3E,bg=#001F3E,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#001F3E,bg=#0A2E52]#[fg=#00CF6A,bg=#0A2E52] #I #[fg=#001F3E,bg=#00CF6A] #{b:pane_current_path} #[fg=#00CF6A,bg=#001F3E,nobold,nounderscore,noitalics]"
