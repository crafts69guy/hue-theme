# Generated by scripts/build.ts. Do not edit.
# Huế Mưa — Hue theme for tmux. Source this from tmux.conf.

# Copy mode + messages
set -g mode-style "fg=#001F3E,bg=#B0DDFF"
set -g message-style "fg=#001F3E,bg=#FFFFFF"
set -g message-command-style "fg=#001F3E,bg=#FFFFFF"

# Panes
set -g pane-border-style "fg=#5C7BA8"
set -g pane-active-border-style "fg=#00753C"
set -g display-panes-active-colour "#00753C"
set -g display-panes-colour "#384B63"
setw -g clock-mode-colour "#00753C"

# Status bar
set -g status "on"
set -g status-interval 1
set -g status-justify "left"
set -g status-style "fg=#384B63,bg=#FFFFFF"
set -g status-bg "#EDF3FE"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#EDF3FE,bg=#00753C,bold] #S:#I.#P #[fg=#00753C,bg=#B0DDFF,nobold,nounderscore,noitalics]#[fg=#001F3E,bg=#B0DDFF,bold] #(whoami) #[fg=#B0DDFF,bg=#EDF3FE,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#B0DDFF,bg=#EDF3FE,nobold,nounderscore,noitalics]#[fg=#384B63,bg=#B0DDFF] #[fg=#6B2FD0,bg=#B0DDFF,nobold,nounderscore,noitalics]#[fg=#EDF3FE,bg=#6B2FD0,bold] #h "

# Window list
setw -g window-status-activity-style "underscore,fg=#384B63,bg=#EDF3FE"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#384B63,bg=#EDF3FE"
setw -g window-status-format "#[fg=#EDF3FE,bg=#EDF3FE]#[default] #I  #{b:pane_current_path} #[fg=#EDF3FE,bg=#EDF3FE,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#EDF3FE,bg=#FFFFFF]#[fg=#00753C,bg=#FFFFFF] #I #[fg=#EDF3FE,bg=#00753C] #{b:pane_current_path} #[fg=#00753C,bg=#EDF3FE,nobold,nounderscore,noitalics]"
